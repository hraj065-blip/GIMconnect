name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Write Firebase config when provided
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          else
            echo "FIREBASE_GOOGLE_SERVICES_JSON not set; debug APK will build without FCM runtime config."
          fi

      - name: Prepare signing config when provided
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/upload-keystore.jks
            {
              printf 'storeFile=app/upload-keystore.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > mobile/android/keystore.properties
          else
            echo "Signing secrets not set; release APK will be skipped."
          fi

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build signed release APK when signing is configured
        working-directory: mobile/android
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease
          else
            echo "No keystore.properties file; skipping signed release build."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gim-connect-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: gim-connect-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
