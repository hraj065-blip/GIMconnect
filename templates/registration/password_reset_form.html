{% extends "connect/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="narrow-shell">
  <div class="form-card">
    <span class="eyebrow">Account recovery</span>
    <h1>Reset your password.</h1>
    <p class="muted sub">Enter your GIM email and we will send a secure reset link.</p>
    <form method="post" class="stack-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button full" type="submit">Send reset link</button>
    </form>
    <p class="form-foot"><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</section>
{% endblock %}
