{% extends "connect/base.html" %}
{% block title %}Reset email sent{% endblock %}
{% block content %}
<section class="narrow-shell">
  <div class="form-card">
    <span class="eyebrow">Check your inbox</span>
    <h1>Reset link sent.</h1>
    <p class="muted sub">If an account exists for that email, a password reset link is on the way.</p>
    <p class="form-foot"><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</section>
{% endblock %}
